<!DOCTYPE html>
<html>
<head>
    <title>AR Click Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #message-text {
            font-family: sans-serif;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body style='margin : 0px; overflow: hidden;'>
    <a-scene
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: true;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <a-assets>
             <img id="testLogoAsset" src="images/logo.jpg" crossOrigin="anonymous">
        </a-assets>

        <a-image
            id="test-image"
            src="#testLogoAsset"
            position="0 1.2 -2"
            width="1"
            height="1">
        </a-image>

        <a-text
            id="message-text"
            value=""
            position="0 1.95 -2"
            align="center"
            color="yellow"
            width="2"
            visible="false">
        </a-text>

        <a-camera raycaster="objects: #test-image;" cursor="rayOrigin: mouse; fuse: false;"></a-camera>

    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');
            const testImage = document.getElementById('test-image');
            const messageText = document.getElementById('message-text');

            sceneEl.addEventListener('loaded', () => {
                console.log("AR Click Test Scene loaded.");

                // Click listener for testImage (remains the same)
                if (testImage && messageText) {
                    testImage.addEventListener('click', () => {
                        console.log("Test image clicked!");
                        messageText.setAttribute('value', 'hello');
                        messageText.setAttribute('visible', 'true');

                        // Optional: Hide message again after a few seconds
                        setTimeout(() => {
                            messageText.setAttribute('visible', 'false');
                        }, 3000);
                    });
                } else {
                    if (!testImage) console.error("#test-image not found");
                    if (!messageText) console.error("#message-text not found");
                }
            });

            sceneEl.addEventListener('arjs-video-loaded', () => {
                console.log("arjs-video-loaded event fired.");
                if (testImage && messageText) {
                    testImage.setAttribute('position', { x: 0, y: 1.2, z: -2 });
                    messageText.setAttribute('position', { x: 0, y: 1.95, z: -2 });
                    // console.log("Image and text positions reset via arjs-video-loaded."); // Combined below
                }

                const cameraEl = sceneEl.camera.el;
                if (cameraEl) {
                    const raycasterComponent = cameraEl.components.raycaster;
                    if (raycasterComponent) {
                        raycasterComponent.refreshObjects();
                        console.log("Positions reset and raycaster refreshed after arjs-video-loaded.");
                    } else {
                        console.warn("Raycaster component not found on camera for arjs-video-loaded refresh.");
                    }
                } else {
                    console.warn("Camera element not found for arjs-video-loaded refresh.");
                }

                // ADD NEW CODE BELOW THIS LINE
                console.log("Attempting to synchronize A-Frame canvas size...");
                const canvas = sceneEl.canvas;
                if (canvas) {
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                }
                sceneEl.resize(); // This should update the renderer and camera projection
                console.log("sceneEl.resize() called.");

                const cameraElAfterResize = sceneEl.camera.el; // Re-get, just in case
                if (cameraElAfterResize) {
                    const raycasterComponent = cameraElAfterResize.components.raycaster;
                    if (raycasterComponent) {
                        raycasterComponent.refreshObjects();
                        console.log("Raycaster objects refreshed AGAIN after scene resize.");
                    } else {
                        console.warn("Raycaster component not found for final refresh.");
                    }
                } else {
                    console.warn("Camera element not found for final raycaster refresh.");
                }
            });
        });
    </script>
</body>
</html>
