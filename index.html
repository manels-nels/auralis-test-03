<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      
      <!-- Marker Hiro -->
      <a-marker preset="hiro">
        <!-- Carré vert dans la scène -->
        <a-plane 
          id="clickable"
          position="0 0 0"
          width="1" 
          height="1" 
          color="green"
          class="clickable">
        </a-plane>

        <!-- Texte caché au départ -->
        <a-entity 
          id="bonjour-text" 
          visible="false"
          position="0 0.6 0"
          text="value: bonjour; color: red; align: center;">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Gestion du clic sur toute la surface du carré
      document.querySelector('#clickable').addEventListener('click', function () {
        document.querySelector('#bonjour-text').setAttribute('visible', 'true');
      });
    </script>
  </body>
</html>
