<!DOCTYPE html>
<html>
<head>
    <title>AR Simplest Click Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Bare minimum A-Frame + AR.js: Clicking a red square via manual raycast.">

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>

<body style='margin: 0px; overflow: hidden;'>

    <!-- Scène A-Frame AR -->
    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <!-- Le carré rouge (pas d'attributs superflus) -->
        <a-plane
            id="clickable-square"
            position="0 1.6 -3"
            width="1.5"
            height="1.5"
            color="#FF0000"
            material="shader: flat; side: double;"
            >
        </a-plane>

        <!-- Caméra SANS cursor/raycaster, mais avec ID -->
        <a-camera id="camera">
        </a-camera>

    </a-scene>

    <!-- Script minimal avec Raycasting Manuel -->
    <script>
        // Initialisation Raycaster Manuel et Helpers
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let threeCamera;
        let clickableMeshes = []; // Uniquement le carré ici

        // Helper pour trouver l'entité A-Frame parente
        function findParentEntity(object) {
            let current = object;
            while (current) {
                if (current.el && current.el.isEntity) return current.el;
                current = current.parent;
            }
            return null;
        }

        // Fonction de gestion du Tap/Clic Écran
        function handleScreenTap(event) {
            if (!threeCamera || clickableMeshes.length === 0) return;

            let touchX, touchY;
            if (event.changedTouches && event.changedTouches.length > 0) {
                touchX = event.changedTouches[0].clientX;
                touchY = event.changedTouches[0].clientY;
            } else if (event.clientX !== undefined) {
                touchX = event.clientX;
                touchY = event.clientY;
            } else { return; }

            mouse.x = (touchX / window.innerWidth) * 2 - 1;
            mouse.y = - (touchY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, threeCamera);
            const intersects = raycaster.intersectObjects(clickableMeshes, false);

            if (intersects.length > 0) {
                const parentEntity = findParentEntity(intersects[0].object);
                if (parentEntity && parentEntity.id === 'clickable-square') {
                    console.log(`Manual Raycast intersected: ${parentEntity.id} - SUCCESS!`);
                    // Action simple: Change la couleur du carré au clic
                    parentEntity.setAttribute('color', '#' + Math.floor(Math.random()*16777215).toString(16));
                }
            }
        }

        // Logique d'initialisation
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener('loaded', () => {
                console.log("AR Scene Loaded. Setting up manual raycast...");

                const cameraEntity = document.getElementById('camera');
                const redSquareElement = document.getElementById('clickable-square');

                // 1. Obtenir la caméra THREE.js
                if (cameraEntity) {
                     const getThreeCam = () => {
                        if(!threeCamera && cameraEntity.components.camera?.camera) {
                             threeCamera = cameraEntity.components.camera.camera;
                              console.log("THREE.js Camera obtained.");
                              window.addEventListener('click', handleScreenTap);
                              window.addEventListener('touchend', handleScreenTap);
                              console.log("Screen listeners added.");
                        } else if (!threeCamera) { setTimeout(getThreeCam, 200); }
                     }
                     getThreeCam();
                } else { console.error("Camera entity #camera not found!"); }

                // 2. Obtenir le maillage du carré rouge
                if (redSquareElement) {
                    const addMesh = (mesh) => {
                        if (mesh && !clickableMeshes.includes(mesh)) {
                            console.log("Red square mesh obtained.");
                            clickableMeshes.push(mesh);
                        }
                    };
                    if (redSquareElement.object3DMap?.mesh) { addMesh(redSquareElement.object3DMap.mesh); }
                    else {
                         redSquareElement.addEventListener('object3dset', (evt) => {
                             if (evt.detail.type === 'mesh') { addMesh(evt.detail.object); }
                         }, { once: true });
                    }
                } else { console.error("Red square element #clickable-square not found!"); }

                console.log("Initialization finished.");
            });
        });
    </script>

</body>
</html>
