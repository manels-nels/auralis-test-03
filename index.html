<!DOCTYPE html>
<html>
<head>
    <title>AR Plane Click Test (Camera Listener)</title> <!-- Titre mis à jour -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Minimal A-Frame + AR.js test: Clicking a red plane using camera listener.">

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #click-message {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 3px;
            font-family: sans-serif; font-size: 14px; display: none; z-index: 10;
        }
        /* Style pour le loader simple (gardé) */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: white; z-index: 10000; display: flex; justify-content: center; align-items: center; }

    </style>
</head>

<body style='margin : 0px; overflow: hidden;'>

    <div id="loader">Loading AR...</div> <!-- Loader simple -->
    <div id="click-message">Clicked the Red Square!</div> <!-- Message de clic -->

    <!-- Scène A-Frame AR -->
    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <!-- Pas d'assets nécessaires -->

        <!-- Le carré rouge cliquable -->
        <a-plane
            id="red-square"
            position="0 1.5 -3"
            width="1.5"
            height="1.5"
            color="red"
            material="shader: flat; side: double;"
            data-interactive     
            >
        </a-plane>

        <!-- Caméra avec ID, cursor et raycaster -->
        <a-camera
            id="camera" 
            cursor="rayOrigin: mouse; fuse: false;"
            raycaster="objects: [data-interactive]; far: 20;"
            >
        </a-camera>

    </a-scene>

    <!-- Script MODIFIÉ pour écouter sur la caméra -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener('loaded', () => {
                console.log("AR Scene Loaded. Adding listener to CAMERA.");
                const cameraEl = document.getElementById('camera'); // Cible la caméra
                const clickMessage = document.getElementById('click-message');
                const redSquare = document.getElementById('red-square'); // Optionnel: juste pour vérifier qu'il existe

                // Cacher le loader
                 const loader = document.getElementById('loader');
                 if(loader) loader.style.display = 'none';

                // Vérifier que les éléments existent
                if (cameraEl && clickMessage && redSquare) {

                    // ÉCOUTEUR SUR LA CAMÉRA
                    cameraEl.addEventListener('click', (event) => {
                        // Vérifier quel élément a été intersecté par le raycaster du curseur
                        const clickedEl = event.detail.intersectedEl;

                        // Vérifier si l'élément cliqué est bien notre carré rouge
                        if (clickedEl && clickedEl.id === 'red-square') {
                            console.log("Camera cursor clicked on: red-square!");
                            // Affiche le message brièvement
                            clickMessage.style.display = 'block';
                            setTimeout(() => {
                                clickMessage.style.display = 'none';
                            }, 1500);
                        } else if (clickedEl) {
                            console.log(`Camera cursor clicked on other interactive element: #${clickedEl.id}`);
                        } else {
                            console.log("Camera cursor clicked, but no interactive element intersected.");
                        }
                    });
                    console.log("Click listener added to camera.");

                } else {
                    if (!cameraEl) console.error("Camera element (#camera) not found!");
                    if (!redSquare) console.error("Red square element (#red-square) not found!");
                    if (!clickMessage) console.error("Click message element (#click-message) not found!");
                }
            });
        });
    </script>

</body>
</html>
