<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Floating Cube</title>
<style>
body { margin: 0; overflow: hidden; }
#ar-container {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: -1;
}
</style>
</head>
<body>
<div id="ar-container">
<canvas id="ar-canvas"></canvas>
</div>
<script async src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script async src="https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js"></script>
<script async src="https://unpkg.com/three@0.160.0/examples/jsm/misc/Raycaster.js"></script>
<script async src="https://unpkg.com/three@0.160.0/src/math/Vector2.js"></script>

<script type="module">
    import * as THREE from './build/three.module.js'; // Now we can try a local import if you prefer, after CDN loads it
    import { ARButton } from './jsm/webxr/ARButton.js';
    import { Raycaster } from './jsm/misc/Raycaster.js';
    import { Vector2 } from './src/math/Vector2.js';

    // ... (rest of your JavaScript code) ...


    let scene, camera, renderer, cube, raycaster, pointer;

    init();
    animate();

    async function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('ar-canvas') });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;

        document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

        const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        cube = new THREE.Mesh(geometry, material);
        cube.position.set(0, 0.1, -0.5); // Floating in front
        scene.add(cube);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        raycaster = new Raycaster();
        pointer = new Vector2();

        renderer.domElement.addEventListener('touchstart', onTouchStart);
        renderer.domElement.addEventListener('click', onClick); // Fallback for non-touch devices

        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onTouchStart(event) {
        pointer.x = (event.touches ? event.touches.item(0).clientX : event.clientX) / window.innerWidth * 2 - 1;
        pointer.y = - (event.touches ? event.touches.item(0).clientY : event.clientY) / window.innerHeight * 2 + 1;
        castRay();
    }

    function onClick(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = - (event.clientY / window.innerHeight) * 2 + 1;
        castRay();
    }

    function castRay() {
        if (renderer.xr.isPresenting) {
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects([cube]);

            if (intersects.length > 0) {
                const randomColor = Math.random() * 0xffffff;
                cube.material.color.set(randomColor);
            }
        }
    }

    function animate() {
        renderer.setAnimationLoop(render);
    }

    function render() {
        renderer.render(scene, camera);
    }
</script>

</body>
</html>
