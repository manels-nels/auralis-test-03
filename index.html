<!DOCTYPE html>
<html>
<head>
    <title>AURALIS Experience (Curved Image Visibility Test)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="A-Frame + AR.js example - Testing curved image visibility.">

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        /* --- Style pour l'écran de chargement initial --- */
        #initial-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2a; z-index: 10000; display: flex;
            justify-content: center; align-items: center; color: white;
            font-size: 1.5em; font-family: sans-serif; text-align: center;
            line-height: 1.4; opacity: 1; transition: opacity 0.7s ease-out;
        }
        /* --- Fin Style chargement initial --- */
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #message-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; background-color: rgba(0, 0, 0, 0.7); color: white;
            padding: 15px 25px; border-radius: 5px; text-align: center;
            font-size: 1.2em; display: none; cursor: pointer;
        }
        #sound-toggle-button {
            position: absolute; bottom: 20px; left: 20px; z-index: 9;
            padding: 10px 15px; font-size: 1em; font-family: sans-serif; color: #333;
            background-color: rgba(255, 255, 255, 0.8); border: 1px solid #ccc;
            border-radius: 5px; cursor: pointer; display: none;
        }
        #sound-toggle-button:hover { background-color: rgba(255, 255, 255, 1); }
    </style>
</head>

<body style='margin : 0px; overflow: hidden;'>

    <div id="initial-loader">
        <div>Auralis experience Loading,<br>be patient...8</div>
    </div>
    <div id="message-popup"></div>
    <button id="sound-toggle-button">Play Sound</button>

    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <a-assets timeout="60000">
             <img id="logoAsset" src="images/logo.jpg" crossOrigin="anonymous">
             <img id="wangMengAsset" src="images/wang_meng.jpg" crossOrigin="anonymous">
             <img id="yumiaoAsset" src="images/yu_miao.jpg" crossOrigin="anonymous">
             <img id="manelsAsset" src="images/manels.jpg" crossOrigin="anonymous">
             <img id="stageWideAsset" src="images/stage_wide.jpg" crossOrigin="anonymous">
             <img id="stageduoBlueAsset" src="images/stage_duo_blue.jpg" crossOrigin="anonymous">
             <img id="stageduoDarkAsset" src="images/stage_duo_dark.jpg" crossOrigin="anonymous">
             <audio id="logoAudio" src="audio/auralis.mp3" preload="auto" crossOrigin="anonymous"></audio>
             <a-asset-item id="jellyfishModel" src="models/meduse.glb" crossOrigin="anonymous"></a-asset-item>
        </a-assets>

        <!-- *** DÉBUT SUPPRESSION *** -->
        <!-- Les <a-image> suivantes ont été supprimées -->
        <!--
        <a-image id="clickable-logo" ... ></a-image>
        <a-image id="clickable-wangmeng" ... ></a-image>
        <a-image id="clickable-yumiao" ... ></a-image>
        <a-image id="clickable-manels" ... ></a-image>
        <a-image id="clickable-stagewide" ... ></a-image>
        <a-image id="clickable-stageduoblue" ... ></a-image>
        <a-image id="clickable-stageduodark" ... ></a-image>
        -->
        <!-- *** FIN SUPPRESSION *** -->

        <!-- Les images courbes (de test) seront ajoutées ici par JavaScript -->

        <!-- Méduses (Tes instances HTML - inchangées) -->
        <a-gltf-model id="jellyfish-INSTANCE-1" src="#jellyfishModel" position="-1 2 -2" scale="0.3 0.3 0.3" rotation="0 0 0" animation__pos="property: position; from: -1 2 -2; to: 1 1.2 -1.5; dir: alternate; dur: 12000; easing: easeInOutSine; loop: true;" animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;" animation-mixer="clip: *; loop: repeat"></a-gltf-model>
        <a-gltf-model id="jellyfish-INSTANCE-2" src="#jellyfishModel" position="-1 2 -5" scale="0.2 0.2 0.2" rotation="0 0 0" animation__pos="property: position; from: 1 2 -4; to: -1 -1.2 -4; dir: alternate; dur: 18000; easing: easeInOutSine; loop: true;" animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;" animation-mixer="clip: *; loop: repeat"></a-gltf-model>

        <!-- Caméra (inchangée) -->
        <a-camera cursor="rayOrigin: mouse; fuse: false;" raycaster="objects: [data-interactive];"></a-camera>

    </a-scene>

    <!-- Script complet et modifié pour le TEST -->
    <script>
        // --- AJOUT: Données du Contenu (Pour Aspect Ratio) ---
        const contentData = [
            { type: 'image', srcId: 'logoAsset',       originalWidth: 1,   originalHeight: 1 },
            { type: 'image', srcId: 'wangMengAsset',   originalWidth: 1,   originalHeight: 1.2 },
            { type: 'image', srcId: 'yumiaoAsset',     originalWidth: 1.5, originalHeight: 1 },
            { type: 'image', srcId: 'manelsAsset',     originalWidth: 1,   originalHeight: 1.25 },
            { type: 'image', srcId: 'stageWideAsset',  originalWidth: 2,   originalHeight: 1.1 },
            { type: 'image', srcId: 'stageduoBlueAsset', originalWidth: 1.8, originalHeight: 1.1 },
            { type: 'image', srcId: 'stageduoDarkAsset', originalWidth: 1.8, originalHeight: 1.1 }
        ];
        // --- Fin Données ---

        // --- MODIFICATION: Fonction createImagePanel (VERSION DE TEST SIMPLIFIÉE) ---
        function createImagePanel(itemData) {
            console.log(`[TEST] Attempting simple panel for: ${itemData?.srcId}`);
            const sceneEl = document.querySelector('a-scene');
            if (!sceneEl) { console.error("Scene not found!"); return null; }
            if (!itemData || !itemData.srcId) { console.warn("Invalid itemData:", itemData); return null; }
            const imgElement = document.getElementById(itemData.srcId);
            if (!imgElement) { console.error(`Asset ${itemData.srcId} not found!`); return null; }

            const curvedImage = document.createElement('a-curvedimage');

            const TEST_RADIUS = 3;
            const TEST_HEIGHT = 1.0;
            const TEST_THETA = 30;
            const TEST_POSITION = "0 1.6 -0.1";
            const TEST_ROTATION = "0 0 0";

            curvedImage.setAttribute('src', `#${itemData.srcId}`);
            curvedImage.setAttribute('radius', TEST_RADIUS);
            curvedImage.setAttribute('height', TEST_HEIGHT);
            curvedImage.setAttribute('theta-length', TEST_THETA);
            curvedImage.setAttribute('material', 'shader: flat; transparent: true; side: double;');
            // curvedImage.setAttribute('data-interactive', ''); // Pas nécessaire pour ce test

            curvedImage.setAttribute('position', TEST_POSITION);
            curvedImage.setAttribute('rotation', TEST_ROTATION);

            sceneEl.appendChild(curvedImage);
            console.log(`--- [TEST] Appended simple curved panel for ${itemData.srcId}`);
            return curvedImage;
        }

        // --- AJOUT: Nouvelle fonction setupManualLayout (appelle la version de test) ---
        function setupManualLayout() {
            const oldPanels = document.querySelectorAll('a-curvedimage');
            oldPanels.forEach(panel => panel.parentNode?.removeChild(panel));
            console.log("Cleared previous curved panels (if any).");

            contentData.forEach((item) => {
                if (item.type === 'image' && item.srcId) {
                    createImagePanel(item); // Appelle la version de TEST
                }
            });
            console.log("Simplified test layout generation complete.");
        }

        // --- Fonction pour contrôler le son (INCHANGÉE, mais va logguer une erreur car #clickable-logo n'existe plus) ---
        function toggleLogoSound() {
            const logoElement = document.getElementById('clickable-logo'); // Cet ID n'est plus utilisé pour une a-image
            const soundButton = document.getElementById('sound-toggle-button');
            if (!logoElement || !soundButton) { console.error("Expected: Logo element (#clickable-logo) or sound button not found in TEST version."); return; }
            const soundComponent = logoElement.components.sound; // Ne trouvera pas le composant son sur l'ancien ID
            if (!soundComponent) { console.error("Expected: Sound component not found on non-existent #clickable-logo in TEST version."); return; }
            // ... le reste échouera probablement ...
        }

        // --- Logique d'initialisation MODIFIÉE ---
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener('loaded', () => {
                console.log("A-Frame scene loaded. Initializing TEST layout and elements...");

                // Cacher l'écran de chargement initial
                const initialLoader = document.getElementById('initial-loader');
                if (initialLoader) {
                    initialLoader.style.opacity = '0';
                    setTimeout(() => { initialLoader.style.display = 'none'; }, 700);
                } else { console.warn("Initial loader element not found!"); }

                // Appeler setupManualLayout pour créer les images de TEST
                setupManualLayout();

                 // --- Bloc pour récupérer les éléments HTML a-image et ajouter listeners SUPPRIMÉ ---

                // Activer le bouton Son (Tentative, loguera une erreur car #clickable-logo n'existe plus)
                const soundButton = document.getElementById('sound-toggle-button');
                setTimeout(() => {
                     const logoPanelExists = document.getElementById('clickable-logo'); // Ne trouvera rien
                     if (soundButton && logoPanelExists) {
                         // Ne devrait pas s'exécuter
                     } else {
                         if (!soundButton) console.error("Sound toggle button not found!");
                         if (!logoPanelExists) console.log("Info: Logo element (#clickable-logo) not found as expected in TEST version, sound button not activated.");
                     }
                }, 150);

                // Activer le clic pour cacher le pop-up
                const messagePopup = document.getElementById('message-popup');
                if (messagePopup) {
                    messagePopup.addEventListener('click', () => { messagePopup.style.display = 'none'; });
                    console.log("Added click listener to hide message popup.");
                } else {
                     console.error("Message popup element (#message-popup) not found on scene load.");
                }

                console.log("TEST Initialization complete.");

            }); // Fin de sceneEl.addEventListener('loaded')
        }); // Fin de document.addEventListener('DOMContentLoaded')
    </script>

</body>
</html>
