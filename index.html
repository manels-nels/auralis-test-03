<!DOCTYPE html>
<html>
<head>
    <title>AURALIS Experience (Curved Specific Layout)</title> <!-- Titre mis à jour -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="A-Frame + AR.js with specific curved layout, clicks, sound toggle, jellyfish and loading screen."> <!-- Description mise à jour -->

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        /* --- Style pour l'écran de chargement initial --- */
        #initial-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2a; z-index: 10000; display: flex;
            justify-content: center; align-items: center; color: white;
            font-size: 1.5em; font-family: sans-serif; text-align: center;
            line-height: 1.4; opacity: 1; transition: opacity 0.7s ease-out;
        }
        /* --- Fin Style chargement initial --- */

        /* Style pour le corps */
        body { margin: 0; overflow: hidden; font-family: sans-serif; }

        /* Style pour le message pop-up */
        #message-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10001; /* Au-dessus du bouton son */ background-color: rgba(0, 0, 0, 0.7); color: white;
            padding: 15px 25px; border-radius: 5px; text-align: center;
            font-size: 1.2em; display: none; cursor: pointer; max-width: 80%;
        }
        /* Style pour le bouton Son */
        #sound-toggle-button {
            position: absolute; bottom: 20px; left: 20px; z-index: 10000; /* Sous le popup */
            padding: 10px 15px; font-size: 1em; font-family: sans-serif; color: #333;
            background-color: rgba(255, 255, 255, 0.8); border: 1px solid #ccc;
            border-radius: 5px; cursor: pointer; display: none;
        }
        #sound-toggle-button:hover { background-color: rgba(255, 255, 255, 1); }

    </style>
</head>

<body style='margin : 0px; overflow: hidden;'>

    <!-- --- Écran de chargement initial --- -->
    <div id="initial-loader">
        <div>Auralis experience Loading,<br>be patient...4</div>
    </div>
    <!-- --- Fin Écran de chargement initial --- -->

    <!-- Div HTML pour afficher le message -->
    <div id="message-popup"></div>

    <!-- Bouton pour contrôler le son du logo -->
    <button id="sound-toggle-button">Play Sound</button>

    <!-- Scène A-Frame AR -->
    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <!-- Assets : Précharger les images, le son ET le modèle 3D -->
        <a-assets timeout="60000">
             <!-- Images -->
             <img id="logoAsset" src="images/logo.jpg" crossOrigin="anonymous">
             <img id="wangMengAsset" src="images/wang_meng.jpg" crossOrigin="anonymous">
             <img id="yumiaoAsset" src="images/yu_miao.jpg" crossOrigin="anonymous">
             <img id="manelsAsset" src="images/manels.jpg" crossOrigin="anonymous">
             <img id="stageWideAsset" src="images/stage_wide.jpg" crossOrigin="anonymous">
             <img id="stageduoBlueAsset" src="images/stage_duo_blue.jpg" crossOrigin="anonymous">
             <img id="stageduoDarkAsset" src="images/stage_duo_dark.jpg" crossOrigin="anonymous">
             <!-- Audio -->
             <audio id="logoAudio" src="audio/auralis.mp3" preload="auto" crossOrigin="anonymous"></audio>
             <!-- Modèle 3D -->
             <a-asset-item id="jellyfishModel" src="models/meduse.glb" crossOrigin="anonymous"></a-asset-item>
        </a-assets>

        <!-- Les images courbes seront ajoutées ici par JavaScript -->
        <!-- SUPPRESSION des <a-image> effectuée -->

        <!-- Méduses (Tes instances HTML, assure des ID uniques) -->
        <a-gltf-model id="jellyfish-INSTANCE-1" src="#jellyfishModel" position="-1 2 -2" scale="0.3 0.3 0.3" rotation="0 0 0" animation__pos="property: position; from: -1 2 -2; to: 1 1.2 -1.5; dir: alternate; dur: 12000; easing: easeInOutSine; loop: true;" animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;" animation-mixer="clip: *; loop: repeat"></a-gltf-model>
        <a-gltf-model id="jellyfish-INSTANCE-2" src="#jellyfishModel" position="-1 2 -5" scale="0.2 0.2 0.2" rotation="0 0 0" animation__pos="property: position; from: 1 2 -4; to: -1 -1.2 -4; dir: alternate; dur: 18000; easing: easeInOutSine; loop: true;" animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;" animation-mixer="clip: *; loop: repeat"></a-gltf-model>

        <!-- Caméra -->
        <a-camera cursor="rayOrigin: mouse; fuse: false;" raycaster="objects: [data-interactive];"></a-camera>

    </a-scene>

        <!-- Script complet et modifié avec DEBUGGING -->
    <script>
        // --- Configuration Layout Courbe Spécifique ---
        const PANEL_BASE_WIDTH = 1.5;
        const CYLINDER_RADIUS = 3.0;
        const BASE_Y_POSITION = 1.6;

        // --- Positions souhaitées ---
        const imagePositions = {
            // VÉRIFIE QUE CES CLÉS SONT IDENTIQUES AUX ID DES <img> DANS <a-assets>
            'logoAsset':       { x: 0,    y: 0,    z: 0.1 },
            'wangMengAsset':   { x: -30,  y: 0.5,  z: 0 },
            'yumiaoAsset':     { x: 30,   y: 0.4,  z: 0 },
            'manelsAsset':     { x: 60,   y: 0.8,  z: -0.2 },
            'stageWideAsset':  { x: -60,  y: -0.5, z: 0 },
            'stageduoBlueAsset':{ x: 0,    y: 1.0,  z: -0.3 },
            'stageduoDarkAsset':{ x: 0,    y: -1.0, z: 0.2 }
        };

        // --- Données du Contenu ---
        const contentData = [
            // VÉRIFIE QUE CES srcId SONT IDENTIQUES AUX ID DES <img> DANS <a-assets>
            { type: 'image', srcId: 'logoAsset',       originalWidth: 1,   originalHeight: 1 },
            { type: 'image', srcId: 'wangMengAsset',   originalWidth: 1,   originalHeight: 1.2 },
            { type: 'image', srcId: 'yumiaoAsset',     originalWidth: 1.5, originalHeight: 1 },
            { type: 'image', srcId: 'manelsAsset',     originalWidth: 1,   originalHeight: 1.25 },
            { type: 'image', srcId: 'stageWideAsset',  originalWidth: 2,   originalHeight: 1.1 },
            { type: 'image', srcId: 'stageduoBlueAsset', originalWidth: 1.8, originalHeight: 1.1 },
            { type: 'image', srcId: 'stageduoDarkAsset', originalWidth: 1.8, originalHeight: 1.1 }
        ];
        // --- Fin Données ---

                // --- Fonction createImagePanel (VERSION DE TEST SIMPLIFIÉE) ---
        function createImagePanel(itemData) {
            console.log(`[TEST] Attempting simple panel for: ${itemData?.srcId}`);
            const sceneEl = document.querySelector('a-scene');
            if (!sceneEl || !itemData || !itemData.srcId) return null;
            const imgElement = document.getElementById(itemData.srcId);
             if (!imgElement || !itemData.originalWidth || !itemData.originalHeight) { return null; } // Simplifié

            const curvedImage = document.createElement('a-curvedimage');

            // --- VALEURS FIXES POUR LE TEST ---
            const TEST_RADIUS = 3;
            const TEST_HEIGHT = 1.0; // Hauteur fixe
            const TEST_THETA = 30;   // Largeur angulaire fixe (30 degrés)
            const TEST_POSITION = "0 1.6 -0.1"; // Position fixe devant, Y=1.6, très légèrement devant 0
            const TEST_ROTATION = "0 0 0";    // Rotation fixe
            // --- FIN VALEURS FIXES ---

            curvedImage.setAttribute('src', `#${itemData.srcId}`);
            curvedImage.setAttribute('radius', TEST_RADIUS);
            curvedImage.setAttribute('height', TEST_HEIGHT);
            curvedImage.setAttribute('theta-length', TEST_THETA);
            curvedImage.setAttribute('material', 'shader: flat; transparent: true; side: double;'); // Ajout side:double au cas où
            curvedImage.setAttribute('data-interactive', ''); // Garde pour le clic si besoin

            // NE PAS utiliser la position/rotation calculée pour ce test
            curvedImage.setAttribute('position', TEST_POSITION);
            curvedImage.setAttribute('rotation', TEST_ROTATION);

            // Pas besoin de gérer les clics spécifiques pour ce test simple

            sceneEl.appendChild(curvedImage);
            console.log(`--- [TEST] Appended simple curved panel for ${itemData.srcId}`);
            return curvedImage;
        }

            
            // (Ajoute les autres else if ici)

            sceneEl.appendChild(curvedImage);
             console.log(`--- Successfully CREATED AND APPENDED panel for ${itemData.srcId}`); // DEBUG
            return curvedImage;
        }

        // --- Fonction pour mettre en place le layout ---
        function setupManualLayout() {
             console.log("Running setupManualLayout..."); // DEBUG
            const oldPanels = document.querySelectorAll('a-curvedimage');
            if (oldPanels.length > 0) {
                console.log(`Clearing ${oldPanels.length} previous curved panels...`); // DEBUG
                oldPanels.forEach(panel => panel.parentNode?.removeChild(panel));
            } else {
                 console.log("No previous curved panels to clear."); // DEBUG
            }

            if (!contentData || contentData.length === 0) {
                 console.error("contentData array is empty or undefined!"); // DEBUG
                 return;
            }

            console.log(`Iterating through ${contentData.length} items in contentData...`); // DEBUG
            contentData.forEach((item) => {
                if (item.type === 'image' && item.srcId) {
                    createImagePanel(item); // Appelle la fonction de création
                } else {
                    console.warn("Skipping item in contentData due to missing type/srcId:", item); // DEBUG
                }
            });
            console.log("Finished setupManualLayout."); // DEBUG
        }

        // --- Fonction pour contrôler le son (INCHANGÉE) ---
        function toggleLogoSound() { /* ... code identique ... */ }

        // --- Logique d'initialisation ---
        document.addEventListener('DOMContentLoaded', () => {
            console.log("DOMContentLoaded event fired."); // DEBUG
            const sceneEl = document.querySelector('a-scene');
             if (!sceneEl) {
                 console.error("!!! CRITICAL: A-Frame scene element not found on DOMContentLoaded!"); // DEBUG
                 return;
            }

            sceneEl.addEventListener('loaded', () => {
                console.log("A-Frame scene 'loaded' event fired. Initializing layout and elements..."); // DEBUG

                // Cacher l'écran de chargement initial
                const initialLoader = document.getElementById('initial-loader');
                if (initialLoader) {
                    initialLoader.style.opacity = '0';
                    setTimeout(() => { initialLoader.style.display = 'none'; }, 700);
                } else { console.warn("Initial loader element not found!"); }

                // Mettre en place le layout courbe
                setupManualLayout(); // Appel crucial

                // Activer le bouton Son
                const soundButton = document.getElementById('sound-toggle-button');
                setTimeout(() => {
                     const logoPanelExists = document.getElementById('logo-panel');
                     if (soundButton && logoPanelExists) {
                         console.log("Activating sound toggle button.");
                         soundButton.style.display = 'block';
                         soundButton.addEventListener('click', toggleLogoSound);
                     } else {
                         if (!soundButton) console.error("Sound toggle button not found!");
                         if (!logoPanelExists) console.error("Logo panel (#logo-panel) not found after layout, cannot activate sound button!");
                     }
                }, 150);

                // Activer le clic pour cacher le pop-up
                const messagePopup = document.getElementById('message-popup');
                if (messagePopup) {
                    messagePopup.addEventListener('click', () => { messagePopup.style.display = 'none'; });
                    console.log("Added click listener to hide message popup.");
                } else {
                     console.error("Message popup element (#message-popup) not found on scene load.");
                }

                console.log("Initialization complete.");

            }); // Fin de sceneEl.addEventListener('loaded')

            // DEBUG: Ajouter un listener d'erreur sur la scène
             sceneEl.addEventListener('error', (evt) => {
                 console.error("A-Frame scene error event:", evt);
             });
             console.log("Error listener added to scene."); // DEBUG

        }); // Fin de document.addEventListener('DOMContentLoaded')
    </script>

</body>
</html>
</html>
