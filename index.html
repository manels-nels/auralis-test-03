<!DOCTYPE html>
<html>
<head>
    <title>AR Click Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #message-text {
            font-family: sans-serif;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body style='margin : 0px; overflow: hidden;'>
    <a-scene
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: true;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <a-assets>
             <img id="testLogoAsset" src="images/logo.jpg" crossOrigin="anonymous">
        </a-assets>

        <a-image
            id="test-image"
            src="#testLogoAsset"
            position="0 1.2 -2"
            width="1"
            height="1">
        </a-image>

        <a-text
            id="message-text"
            value=""
            position="0 1.95 -2"
            align="center"
            color="yellow"
            width="2"
            visible="false">
        </a-text>

        <a-camera></a-camera>

    </a-scene>

    <script>
   document.addEventListener('DOMContentLoaded', () => {
       const sceneEl = document.querySelector('a-scene');
       const testImageEntity = document.getElementById('test-image');
       const messageTextEntity = document.getElementById('message-text');
       
       let threeCamera;
       let threeTestImageObject3D;
       const raycaster = new THREE.Raycaster(); // Create raycaster once
       const ndcVector = new THREE.Vector2();   // Create NDC vector once

       sceneEl.addEventListener('loaded', () => {
           console.log("AR Click Test Scene loaded.");
           // It's generally safer to get the Three.js camera after A-Frame scene is fully loaded
           // and AR.js might have initialized or modified it.
           // However, AR.js might replace the camera, so getting it in arjs-video-loaded is safer.
           // NO MORE testImage.addEventListener('click', ...) HERE
       });

       sceneEl.addEventListener('arjs-video-loaded', () => {
           console.log("arjs-video-loaded event fired.");
           
           if (testImageEntity) {
               testImageEntity.setAttribute('position', { x: 0, y: 1.2, z: -2 });
               // Ensure the THREE.Object3D is available
               if (testImageEntity.object3D) {
                   threeTestImageObject3D = testImageEntity.object3D;
                   console.log("Three.js object for test-image captured.");
               } else {
                   // Fallback if object3D not ready, might need to wait for entity's 'loaded' event
                   testImageEntity.addEventListener('loaded', () => {
                       threeTestImageObject3D = testImageEntity.object3D;
                       console.log("Three.js object for test-image captured after entity load.");
                   });
               }
           }
           if (messageTextEntity) {
               messageTextEntity.setAttribute('position', { x: 0, y: 1.95, z: -2 });
           }
           console.log("Image and text positions reset via arjs-video-loaded.");

           // Get the THREE.Camera used by A-Frame/AR.js
           // sceneEl.camera is the A-Frame entity. sceneEl.camera.el.object3D is the camera group.
           // The actual perspective camera is usually a child of that.
           // Or, if AR.js uses its own, it might be elsewhere.
           // A safer bet for the default A-Frame camera component:
           if (sceneEl.camera && sceneEl.camera.el && sceneEl.camera.el.components.camera) {
                threeCamera = sceneEl.camera.el.components.camera.camera;
                console.log("Three.js camera captured.");
           } else {
               console.error("Could not get Three.js camera from A-Frame camera component.");
               return;
           }
           
           // Canvas sync (previous attempt, keep it for now)
           console.log("Attempting to synchronize A-Frame canvas size...");
           const canvas = sceneEl.canvas;
           if (canvas) {
               canvas.style.width = '100%';
               canvas.style.height = '100%';
           }
           sceneEl.resize(); 
           console.log("sceneEl.resize() called.");
           // No A-Frame raycaster to refresh anymore.
       });

       // Add touch event listener to the scene's canvas
       if (sceneEl.canvas) {
           sceneEl.canvas.addEventListener('touchstart', (event) => {
               event.preventDefault(); // Prevent scrolling/other default actions

               if (!threeCamera || !threeTestImageObject3D) {
                   console.warn("Camera or target object not ready for raycasting.");
                   return;
               }

               const touch = event.touches[0];
               const rect = sceneEl.canvas.getBoundingClientRect();

               const x = (touch.clientX - rect.left) / rect.width;
               const y = (touch.clientY - rect.top) / rect.height;

               ndcVector.x = x * 2 - 1;
               ndcVector.y = -y * 2 + 1;

               raycaster.setFromCamera(ndcVector, threeCamera);
               const intersects = raycaster.intersectObject(threeTestImageObject3D, true);

               if (intersects.length > 0) {
                   console.log("Manual Raycast: Hit the test image!");
                   if (messageTextEntity) {
                       messageTextEntity.setAttribute('value', 'hello (manual)');
                       messageTextEntity.setAttribute('visible', 'true');
                       setTimeout(() => {
                           messageTextEntity.setAttribute('visible', 'false');
                       }, 3000);
                   }
               } else {
                   console.log("Manual Raycast: No hit.");
                   // Optionally, hide message if no hit, or let it timeout
               }
           }, false); // Use capture phase: false
       } else {
           console.error("A-Frame canvas not found to attach touch listener.");
       }
       
   });
   </script>
</body>
</html>
