<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Cylindrical Images</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.2.0/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene vr-mode-ui="enabled: false">
        <!-- Camera -->
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <!-- Cylinder with images -->
        <a-cylinder
            id="image-cylinder"
            radius="2"
            height="3"
            segments-radial="36"
            position="0 1.5 -3"
            material="shader: standard; src: #cylinder-texture; repeat: 1 1;">
        </a-cylinder>

        <!-- Texture for cylinder -->
        <a-assets>
            < img id="logo-image" src="images/logo.jpg" crossorigin="anonymous">
            < img id="manels-image" src="images/manels.jpg" crossorigin="anonymous">
            <canvas id="cylinder-texture" width="1024" height="512"></canvas>
        </a-assets>

        <!-- Sky for background -->
        <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
        // Draw images on the canvas to create a cylindrical texture
        const canvas = document.getElementById('cylinder-texture');
        const ctx = canvas.getContext('2d');

        const logoImage = document.getElementById('logo-image');
        const manelsImage = document.getElementById('manels-image');

        logoImage.onload = () => {
            ctx.drawImage(logoImage, 0, 0, canvas.width / 2, canvas.height);
            manelsImage.onload = () => {
                ctx.drawImage(manelsImage, canvas.width / 2, 0, canvas.width / 2, canvas.height);
            };
        };

        // Function to update the position of the cylinder
        function updateCylinderPosition(x, y, z) {
            const cylinder = document.getElementById('image-cylinder');
            cylinder.setAttribute('position', { x: x, y: y, z: z });
        }

        // Example: Update position (you can call this function with desired coordinates)
        updateCylinderPosition(0, 1.5, -3);
    </script>
</body>
</html>
