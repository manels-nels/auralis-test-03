<!DOCTYPE html>
<html>
<head>
    <title>MindAR Tracking Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Using MindAR versions from their Quick Start Guide for stability -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <!-- 
        USER TESTING INSTRUCTIONS:
        For this test, please use the MindAR "card" image as your AR target. 
        Display this image on another screen or print it:
        https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.png
        (It's an image of a playing card).

        The `imageTargetSrc` below points to the pre-compiled '.mind' file for this card.
        If this test is successful, we will then move to using your own images as targets.
    -->
    <a-scene 
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: yes; uiLoading: yes; filterMinCF:0.001; filterBeta: 0.01;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        embedded> <!-- Added embedded for typical web page integration -->

      <a-assets>
        <!-- Using user's logo.jpg as a texture to display on the target -->
        <img id="userLogoTexture" src="images/logo.jpg" crossOrigin="anonymous">
      </a-assets>

      <!-- Camera setup for MindAR -->
      <a-camera 
        position="0 0 0" 
        look-controls="enabled: false">
      </a-camera>

      <!-- This entity becomes active when the target (card.mind) is detected -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- This plane will display the user's logo.jpg texture -->
        <a-plane 
            src="#userLogoTexture" 
            position="0 0 0" 
            height="0.7"  <!-- Adjusted to better match typical playing card aspect ratio if width is 0.5 -->
            width="0.5" 
            rotation="0 0 0">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.querySelector('a-scene');
        const targetEntity = document.querySelector('[mindar-image-target]');

        if (sceneEl) {
            sceneEl.addEventListener('arReady', () => {
                console.log("MindAR scene is ready");
            });
            sceneEl.addEventListener('arError', (error) => {
                console.error("MindAR scene error:", error);
            });
        }
        
        if (targetEntity) {
            targetEntity.addEventListener('targetFound', event => {
                console.log("MindAR Target Found (card.png should be visible)");
            });
            targetEntity.addEventListener('targetLost', event => {
                console.log("MindAR Target Lost");
            });
        } else {
            console.error("MindAR target entity not found. Check selector '[mindar-image-target]'.");
        }
      });
    </script>
</body>
</html>
