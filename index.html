<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <!-- Carré devant l'utilisateur -->
      <a-plane 
        position="0 0 -1" 
        rotation="0 0 0" 
        width="0.2" 
        height="0.2" 
        color="green"
        id="clickable"
        event-set__click="_event: click; color: red">
      </a-plane>

      <!-- Texte affiché après clic -->
      <a-entity 
        id="bonjour-text" 
        visible="false"
        position="0 0.5 -1"
        text="value: bonjour; color: red; align: center;">
      </a-entity>

      <a-camera-static></a-camera-static>
    </a-scene>

    <script>
      const square = document.querySelector('#clickable');
      const text = document.querySelector('#bonjour-text');
      square.addEventListener('click', () => {
        text.setAttribute('visible', 'true');
      });
    </script>
  </body>
</html>
