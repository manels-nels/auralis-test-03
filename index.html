<!DOCTYPE html>
<html>
<head>
    <title>AURALIS Experience </title> <!-- Titre mis à jour -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="A-Frame + AR.js example with clickable images and a sound toggle button."> <!-- Description mise à jour -->

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        
                /* --- NOUVEAU : Style pour l'écran de chargement initial --- */
        #initial-loader {
            position: fixed; /* Reste fixe même si la page défile (peu probable ici) */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2a; /* Fond sombre, cohérent avec tes panneaux */
            z-index: 10000; /* Au-dessus de tout, y compris le loader AR.js */
            display: flex; /* Utilise flexbox pour centrer */
            justify-content: center;
            align-items: center;
            flex-direction: column; /* <-- AJOUT ICI: pour empiler spinner et texte */
            color: white;
            font-size: 1.5em;
            font-family: sans-serif;
            text-align: center;
            line-height: 1.4; /* Espacement pour le texte sur deux lignes */
            /* Transitions pour un fondu enchaîné (optionnel) */
            opacity: 1;
            transition: opacity 0.7s ease-out;
        }
        /* --- Fin Style chargement initial --- */

        /* --- AJOUT DEBUT : Style et animation pour le spinner --- */
    .loader-spinner {
        border: 5px solid rgba(255, 255, 255, 0.3); /* Bordure grise semi-transparente */
        border-top-color: #FFFFFF; /* Couleur blanche pour la partie qui tourne */
        border-radius: 50%; /* Pour le rendre circulaire */
        width: 50px;  /* Taille du spinner */
        height: 50px; /* Taille du spinner */
        margin-bottom: 25px; /* Espace entre le spinner et le texte */
        animation: spin 1s linear infinite; /* Applique l'animation */
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
    /* --- AJOUT FIN --- */
        
        /* Style pour le corps et le message pop-up */
        body { margin: 0; overflow: hidden; font-family: sans-serif; }


          
        
    

        
            /* REMPLACER l'ancien #message-popup par celui-ci */
    #message-popup {
        position: absolute;
        top: 50%;
        left: 50%;
        /* Début: centrage et état initial (caché et légèrement réduit) */
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
        visibility: hidden; /* Cache complètement et empêche les interactions */
        /* Fin: état initial */
        z-index: 10001; /* Assure qu'il est au-dessus */
        background-color: rgba(30, 30, 50, 0.85); /* Fond un peu plus stylé */
        color: white;
        padding: 20px 30px; /* Padding un peu plus large */
        border-radius: 8px;  /* Arrondi un peu plus marqué */
        text-align: left;
        font-size: 1.1em;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Police plus moderne */
        cursor: pointer;
        width: 90%;
        box-sizing: border-box;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4); /* Ombre portée */
        /* Définition de la transition pour l'animation */
        transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out, visibility 0s linear 0.3s;
        /* Note: La transition sur visibility est décalée pour qu'elle devienne visible seulement quand l'opacité augmente */
        /* --- AJOUTS POUR LE SCROLLING --- */
        max-height: 75vh;       /* Limite la hauteur à 75% de la hauteur de la fenêtre */
        overflow-y: auto;       /* Ajoute une barre de défilement vertical SI nécessaire */
        /* --- FIN AJOUTS --- */
    }
    /* --- Fin du remplacement #message-popup --- */


            /* --- AJOUT : Nouvelle classe pour l'état visible du popup --- */
    #message-popup.visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -50%) scale(1); /* Retour à l'échelle normale */
        /* Inverser le délai de la transition visibility pour la disparition */
        transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out, visibility 0s linear 0s;
    }
    /* --- FIN AJOUT --- */
        
        /* NOUVEAU: Style pour le bouton Son */
        #sound-toggle-button {
            position: absolute;
            bottom: 20px; /* Position en bas */
            left: 20px;   /* Position à gauche */
            z-index: 9;   /* Légèrement sous le popup mais au-dessus de la scène */
            padding: 10px 15px;
            font-size: 1em;
            font-family: sans-serif;
            color: #333;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Caché par défaut, affiché via JS */
        }
        #sound-toggle-button:hover {
            background-color: rgba(255, 255, 255, 1);
        }
    </style>
</head>

<body style='margin : 0px; overflow: hidden;'>

    <!-- --- NOUVEAU : Écran de chargement initial --- -->
    <div id="initial-loader">

        <!-- AJOUT DEBUT: Élément pour le spinner -->
    <div class="loader-spinner"></div>
    <!-- AJOUT FIN -->
        <div>Auralis experience Loading,<br>be patient...T</div>
    </div>
    <!-- --- Fin Écran de chargement initial --- -->

    <!-- Div HTML pour afficher le message (initialement cachée) -->
    <div id="message-popup"></div>

    <!-- NOUVEAU: Bouton pour contrôler le son du logo -->
    <button id="sound-toggle-button">Play Sound</button>

    <!-- Scène A-Frame AR -->
    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <!-- Assets : Précharger les images ET le son -->
        <a-assets timeout="30000">
             <!-- Assure-toi que les chemins vers tes images sont corrects -->
             <img id="logoAsset" src="images/logo.jpg" crossOrigin="anonymous">
             <img id="wangMengAsset" src="images/wang_meng.jpg" crossOrigin="anonymous">
            <img id="yumiaoAsset" src="images/yu_miao.jpg" crossOrigin="anonymous">
             <img id="manelsAsset" src="images/manels.jpg" crossOrigin="anonymous">
             <img id="stageWideAsset" src="images/stage_wide.jpg" crossOrigin="anonymous">
             <img id="stageduoBlueAsset" src="images/stage_duo_blue.jpg" crossOrigin="anonymous">
            <img id="stageduoDarkAsset" src="images/stage_duo_dark.jpg" crossOrigin="anonymous">
             <!-- Assure-toi que le chemin vers ton audio est correct -->
             <audio id="logoAudio" src="audio/auralis.mp3" preload="auto" crossOrigin="anonymous"></audio>

            <a-asset-item id="jellyfishModel" src="models/meduse.glb" crossOrigin="anonymous"></a-asset-item>
        </a-assets>

            <!-- L'image cliquable en RA (logo) AVEC SON (sans autoplay) -->
    <a-image
        id="clickable-logo"
        src="#logoAsset"
        position="0 1.5 -2.7"
        width="1"
        height="1"
          
        sound="src: #logoAudio; loop: true; volume: 0.8; positional: true"
        >
        
        
        <!-- AJOUT FIN -->
    </a-image> <!-- Balise fermante ajoutée -->

        <!-- La deuxième image cliquable (wangmeng) SANS SON -->
        <a-image
            id="clickable-wangmeng"
            src="#wangMengAsset"
            position="1.5 1.5 -2.5" 
            width="1"
            height="1.2"           
            >
        </a-image>

        <a-image
            id="clickable-yumiao"
            src="#yumiaoAsset"
            position="-1.5 1.5 -3" 
            width="1.5"
            height="1"           
            
            >
        </a-image>

        <a-image
            id="clickable-manels"
            src="#manelsAsset"
            position="1.5 3 -3.2" 
            width="1"
            height="1.25"           
            
            >
        </a-image>

        <a-image
            id="clickable-stagewide"
            src="#stageWideAsset"
            position="-1.5 0 -2.8" 
            width="2"
            height="1.1"           
            
            >
        </a-image>

        <a-image
            id="clickable-stageduoblue"
            src="#stageduoBlueAsset"
            position="0 3 -3" 
            width="1.8"
            height="1.1"           
            
            >
        </a-image>

        <a-image
            id="clickable-stageduodark"
            src="#stageduoDarkAsset"
            position="1 0 -2.5" 
            width="1.8"
            height="1.1"           
            
            >
        </a-image>

        <a-plane
        id="logo-collider"        
        data-target="#clickable-logo" 
        position="0 1.5 -2.5"     
        width="1"                 
        height="1"                
        material="visible: true;"
        data-interactive          
        ></a-plane>

    <a-plane
        id="wangmeng-collider"
        data-target="#clickable-wangmeng"
        position="1.5 1.5 -2.5"    
        width="1"                 
        height="1.2"              
        material="visible: false;"
        data-interactive
        ></a-plane>

        <a-plane
        id="yumiao-collider"
        data-target="#clickable-yumiao"
        position="-1.5 1.5 -3"
        width="1.5"
        height="1"
        material="visible: false;"
        data-interactive
        ></a-plane>

    <a-plane
        id="manels-collider"
        data-target="#clickable-manels"
        position="1.5 3 -3.2"
        width="1"
        height="1.25"
        material="visible: false;"
        data-interactive
        ></a-plane>

    <a-plane
        id="stagewide-collider"
        data-target="#clickable-stagewide"
        position="-1.5 0 -2.8"
        width="2"
        height="1.1"
        material="visible: false;"
        data-interactive
        ></a-plane>

    <a-plane
        id="stageduoblue-collider"
        data-target="#clickable-stageduoblue"
        position="0 3 -3"
        width="1.8"
        height="1.1"
        material="visible: false;"
        data-interactive
        ></a-plane>

    <a-plane
        id="stageduodark-collider"
        data-target="#clickable-stageduodark"
        position="1 0 -2.5"
        width="1.8"
        height="1.1"
        material="visible: false;"
        data-interactive
        ></a-plane>
    <!-- AJOUT FIN -->

        <!-- Méduse 3D Animée -->
        <a-gltf-model id="jellyfish"
                      src="#jellyfishModel"
                      position="-1 2 -2" scale="0.3 0.3 0.3" rotation="0 0 0"
                      animation__pos="property: position; from: -1 2 -2; to: 1 1.2 -1.5; dir: alternate; dur: 12000; easing: easeInOutSine; loop: true;"
                      animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;"
                      animation-mixer="clip: *; loop: repeat">
        </a-gltf-model>


        <!-- Méduse 3D Animée -->
        <a-gltf-model id="jellyfish"
                      src="#jellyfishModel"
                      position="-1 2 -5" scale="0.2 0.2 0.2" rotation="0 0 0"
                      animation__pos="property: position; from: 1 2 -4; to: -1 -1.2 -4; dir: alternate; dur: 18000; easing: easeInOutSine; loop: true;"
                      animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;"
                      animation-mixer="clip: *; loop: repeat">
        </a-gltf-model>
        
        <!-- Caméra avec raycaster pour détecter les clics -->
        <a-camera
            cursor="rayOrigin: mouse; fuse: false;"
            raycaster="objects: [data-interactive];" /* Ne tester que les objets avec data-interactive */
            >
        </a-camera>

    </a-scene>

    <!-- Script pour gérer le clic ET le son -->
    <script>
        // Fonction pour activer/désactiver le son du logo
        function toggleLogoSound() {
            const logoElement = document.getElementById('clickable-logo'); // L'élément a-image
            const soundButton = document.getElementById('sound-toggle-button');

            if (!logoElement || !soundButton) {
                console.error("Logo element or sound button not found.");
                return;
            }
            // Accéder au composant son attaché à l'élément
            const soundComponent = logoElement.components.sound;
            if (!soundComponent) {
                 console.error("Sound component not found on logo element.");
                 return;
            }

            // Gérer le contexte audio pour mobile (important au premier clic)
            const sceneEl = document.querySelector('a-scene');
            const audioContext = sceneEl?.audioListener?.context;
            if (audioContext && audioContext.state === 'suspended') {
                console.log("AudioContext suspended, resuming...");
                audioContext.resume().catch(e => console.error("Error resuming audio context", e));
            }

            // Basculer Play/Pause
            if (soundComponent.isPlaying) {
                console.log("Pausing logo sound.");
                soundComponent.pauseSound();
                soundButton.textContent = "Play Sound";
            } else {
                console.log("Playing logo sound.");
                soundComponent.playSound();
                soundButton.textContent = "Pause Sound";
            }
        }

            // --- Logique d'initialisation MODIFIÉE ---
    document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.querySelector('a-scene');

        sceneEl.addEventListener('loaded', () => {
            console.log("A-Frame scene loaded. Initializing interactions...");

            // Cacher l'écran de chargement initial (INCHANGÉ)
            const initialLoader = document.getElementById('initial-loader');
            if (initialLoader) {
                initialLoader.style.opacity = '0';
                setTimeout(() => { initialLoader.style.display = 'none'; }, 700);
            } else { console.warn("Initial loader element not found!"); }


            // --- MODIFICATION DEBUT: Ajouter les listeners aux COLLIDERS ---
            const messagePopup = document.getElementById('message-popup');
            const colliders = document.querySelectorAll('[data-target]'); // Sélectionne tous les colliders

            if (messagePopup && colliders.length > 0) {
                console.log(`Found ${colliders.length} colliders. Adding listeners...`);

                colliders.forEach(collider => {
                    collider.addEventListener('click', (event) => {
                        const targetId = event.target.getAttribute('data-target'); // Récupère l'ID de l'image cible (#clickable-logo, etc.)
                        console.log(`Collider clicked! Target: ${targetId}`);

                        // Arrêter la frappe si elle est en cours
                        if (window.typingIntervalId) {
                            clearInterval(window.typingIntervalId);
                            window.typingIntervalId = null;
                            console.log("Typing effect interrupted.");
                        }

                        // Définir le texte basé sur la cible cliquée
                        let textToShow = "";
                        if (targetId === '#clickable-logo') {
                            textToShow = "Imagine a space where sound moves like liquid, where music is not confined to speakers but swirls around you, weaving an intricate web of vibration and light. Here the past and the Future collide, ancient strings resonate against modern frequencies, and the visual pulse in perfect harmony with a never-shifting soundscape, Welcome to AURALIS";
                            // Démarre l'effet machine à écrire UNIQUEMENT pour le logo
                            startTypingEffect(messagePopup, textToShow); // Appelle une fonction séparée (voir ci-dessous)
                        } else if (targetId === '#clickable-wangmeng') {
                            textToShow = "bye";
                            messagePopup.textContent = textToShow; // Affichage direct pour les autres
                            messagePopup.classList.add('visible');
                                            // ... (if pour logoAsset et wangMengAsset existent déjà) ...
                    } else if (targetId === '#clickable-yumiao') {
                        textToShow = "Texte pour Yumiao";
                        messagePopup.textContent = textToShow;
                        messagePopup.classList.add('visible');
                    } else if (targetId === '#clickable-manels') {
                        textToShow = "Texte pour Manels";
                        messagePopup.textContent = textToShow;
                        messagePopup.classList.add('visible');
                    } else if (targetId === '#clickable-stagewide') {
                        textToShow = "Texte pour Stage Wide";
                        messagePopup.textContent = textToShow;
                        messagePopup.classList.add('visible');
                    } else if (targetId === '#clickable-stageduoblue') {
                        textToShow = "Texte pour Stage Duo Blue";
                        messagePopup.textContent = textToShow;
                        messagePopup.classList.add('visible');
                    } else if (targetId === '#clickable-stageduodark') {
                        textToShow = "Texte pour Stage Duo Dark";
                        messagePopup.textContent = textToShow;
                        messagePopup.classList.add('visible');
                    }
                    // Le 'else' final reste pour les cas non définis
                    else {
                        console.warn(`No specific text defined for target: ${targetId}`);
                        messagePopup.textContent = `Clicked on ${targetId.substring(1)}`; // Enlève le #
                        messagePopup.classList.add('visible');
                    }

                    });
                });

                // Écouteur pour cacher le popup (INCHANGÉ DANS SA LOGIQUE)
                messagePopup.addEventListener('click', () => {
                     // Arrêter la frappe si elle est en cours
                    if (window.typingIntervalId) {
                        clearInterval(window.typingIntervalId);
                        window.typingIntervalId = null;
                        console.log("Typing effect interrupted by closing popup.");
                    }
                    console.log("Popup clicked, hiding.");
                    messagePopup.classList.remove('visible');
                });

                console.log("Click listeners added to colliders and popup.");

            } else {
                if (!messagePopup) console.error("Message popup element not found!");
                if (colliders.length === 0) console.warn("No collider elements found with [data-target] attribute.");
            }
            // --- MODIFICATION FIN ---


            // Activer le bouton Son (INCHANGÉ - il cible toujours #clickable-logo pour le composant son)
            const soundButton = document.getElementById('sound-toggle-button');
            const logoElementExists = document.getElementById('clickable-logo'); // Vérifie l'image visible
            if (soundButton && logoElementExists) {
                console.log("Making sound toggle button visible and attaching listener.");
                soundButton.style.display = 'block';
                soundButton.addEventListener('click', toggleLogoSound);
            } else {
                if (!soundButton) console.error("Sound toggle button element not found!");
                if (!logoElementExists) console.error("Logo element (#clickable-logo) not found, cannot activate sound button!");
            }

            console.log("Initialization complete.");

        }); // Fin de sceneEl.addEventListener('loaded')
    }); // Fin de document.addEventListener('DOMContentLoaded')

    // --- AJOUT: Fonction séparée pour l'effet machine à écrire ---
    function startTypingEffect(popupElement, text) {
        let charIndex = 0;
        const typingSpeed = 40; // Ajuste la vitesse

        popupElement.textContent = ''; // Vide
        popupElement.scrollTop = 0;   // Reset scroll
        popupElement.classList.add('visible'); // Rend visible

        // Arrêter l'ancien intervalle s'il existe
        if (window.typingIntervalId) {
            clearInterval(window.typingIntervalId);
        }

        window.typingIntervalId = setInterval(() => {
            if (charIndex < text.length) {
                popupElement.textContent += text.charAt(charIndex);
                charIndex++;
                popupElement.scrollTop = popupElement.scrollHeight; // Auto-scroll
            } else {
                clearInterval(window.typingIntervalId);
                window.typingIntervalId = null;
                console.log("Typing effect finished.");
            }
        }, typingSpeed);
    }
    // --- FIN AJOUT ---
</script>
</body>
</html>
