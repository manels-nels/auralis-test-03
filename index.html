<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RA - Cylindre d'Images</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Caméra AR -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Déclaration des assets en premier -->
      <a-assets>
        < img id="logo" src="images/logo.jpg">
        < img id="manels" src="images/manels.jpg">
      </a-assets>

      <!-- Image 1 courbée -->
      <a-curvedimage
        src="#logo"
        radius="1.5"
        theta-length="60"
        height="1"
        position="-0.5 0 -2"
        rotation="0 20 0"
      ></a-curvedimage>

      <!-- Image 2 courbée -->
      <a-curvedimage
        src="#manels"
        radius="1.5"
        theta-length="60"
        height="1"
        position="0.5 0 -2"
        rotation="0 -20 0"
      ></a-curvedimage>
    </a-scene>
  </body>
</html>
