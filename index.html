<!DOCTYPE html>
<html>
<head>
    <title>AR Simple Click Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Minimal A-Frame + AR.js: Click the red square.">

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        /* Message de feedback simple */
        #feedback-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            display: none; /* Caché au début */
            z-index: 10;
        }
    </style>
</head>

<body style='margin: 0px; overflow: hidden;'>

    <!-- Message de feedback -->
    <div id="feedback-message">Square Clicked!</div>

    <!-- Scène A-Frame AR -->
    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <!-- Pas besoin d'assets pour un simple carré coloré -->

        <!-- Le carré rouge cliquable -->
        <a-plane
            id="clickable-square"
            position="0 1.6 -3"  
            width="1.5"          
            height="1.5"         
            color="#FF0000"      
            material="shader: flat; side: double;" 
            data-interactive     
            >
        </a-plane>

        <!-- Caméra avec le système de clic standard A-Frame -->
        <a-camera
            cursor="rayOrigin: mouse; fuse: false;" 
            raycaster="objects: [data-interactive]; far: 20;" 
            >
            <!-- Pour voir le rayon (décommenter si besoin) -->
            <!-- raycaster="objects: [data-interactive]; far: 20; showLine: true;" -->
        </a-camera>

    </a-scene>

    <!-- Script minimal pour gérer le clic -->
    <script>
        // Attend que le DOM et A-Frame soient prêts
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener('loaded', () => {
                console.log("AR Scene Loaded.");
                const redSquare = document.getElementById('clickable-square');
                const feedbackMessage = document.getElementById('feedback-message');

                if (redSquare && feedbackMessage) {
                    // Attacher l'écouteur directement à l'entité A-Frame
                    redSquare.addEventListener('click', function (event) {
                        console.log("Click event detected on #clickable-square!");
                        console.log("Intersection details (from event):", event.detail.intersection); // Infos de debug

                        // Afficher le message
                        feedbackMessage.style.display = 'block';
                        // Le cacher après un court instant
                        setTimeout(() => {
                            feedbackMessage.style.display = 'none';
                        }, 2000); // 2 secondes
                    });
                    console.log("Click listener added to #clickable-square.");
                } else {
                    if (!redSquare) console.error("Element #clickable-square not found!");
                    if (!feedbackMessage) console.error("Element #feedback-message not found!");
                }
            });
        });
    </script>

</body>
</html>
