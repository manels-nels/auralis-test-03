<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>WebXR - Carré cliquable</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/webxr/VRButton.js';

    let camera, scene, renderer;
    let square;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(); // Unused but necessary placeholder for the interface

    init();
    animate();

    function init() {
      // Scène
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202020);

      // Caméra
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.z = 1;

      // Lumière
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // Carré (plan)
      const geometry = new THREE.PlaneGeometry(0.5, 0.5);
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      square = new THREE.Mesh(geometry, material);
      square.position.set(0, 1.5, -2); // Juste devant l'utilisateur
      scene.add(square);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // Contrôles cliquables dans WebXR
      renderer.domElement.addEventListener('click', onClick);

      window.addEventListener('resize', onWindowResize);
    }

    function onClick(event) {
      const session = renderer.xr.getSession();
      if (session) {
        const viewerPose = renderer.xr.getCamera(camera);
        const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(viewerPose.quaternion);
        raycaster.set(viewerPose.position, direction);
        const intersects = raycaster.intersectObject(square);
        if (intersects.length > 0) {
          console.log("bonjour");
        }
      } else {
        // Mode non-VR pour test sur navigateur
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(square);
        if (intersects.length > 0) {
          console.log("bonjour");
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
