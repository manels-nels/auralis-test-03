<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carré Cliquable AR</title>
<style>
body { margin: 0; overflow: hidden; }
#info {
position: absolute;
top: 10px;
width: 100%;
text-align: center;
color: white;
z-index: 1;
display: none; /* Initialement caché */
}
</style>
</head>
<body>
<div id="info">Bonjour</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/libs/lil-gui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/libs/stats.module.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/webxr/ARButton.js"></script>
<script>
    let scene, camera, renderer, square, raycaster, textElement;
    const cameraPosition = new THREE.Vector3(0, 0, -0.5); // Position initiale du carré devant l'utilisateur

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        camera.position.copy(cameraPosition);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

        // Création du carré
        const geometry = new THREE.PlaneGeometry(0.2, 0.2);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        square = new THREE.Mesh(geometry, material);
        scene.add(square);

        // Positionnement initial du carré
        square.position.copy(cameraPosition).add(new THREE.Vector3(0, 0, 0.1)); // Léger décalage vers l'avant
        square.lookAt(camera.position); // Faire face à la caméra initialement

        raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        // Récupération de l'élément texte
        textElement = document.getElementById('info');

        // Gestion du clic
        renderer.domElement.addEventListener('touchstart', onTouchStart);
        renderer.domElement.addEventListener('mousedown', onMouseDown);

        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function handleIntersection(x, y) {
        const rect = renderer.domElement.getBoundingClientRect();
        const normalizedX = (x - rect.left) / rect.width * 2 - 1;
        const normalizedY = - (y - rect.top) / rect.height * 2 + 1;

        pointer.x = normalizedX;
        pointer.y = normalizedY;

        raycaster.setFromCamera(pointer, camera);

        const intersects = raycaster.intersectObjects([square]);

        if (intersects.length > 0) {
            // Le carré a été touché/cliqué
            textElement.style.display = 'block';
            setTimeout(() => {
                textElement.style.display = 'none'; // Faire disparaître après un délai
            }, 2000);
        }
    }

    function onTouchStart(event) {
        event.preventDefault();
        if (event.touches.length > 0) {
            handleIntersection(event.touches.item(0).clientX, event.touches.item(0).clientY);
        }
    }

    function onMouseDown(event) {
        event.preventDefault();
        handleIntersection(event.clientX, event.clientY);
    }

    function animate() {
        renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
        if (frame) {
            const referenceSpace = renderer.xr.getReferenceSpace();
            const viewerPose = frame.getViewerPose(referenceSpace);

            if (viewerPose) {
                const head = viewerPose.transform;
                const offset = new THREE.Vector3(0, 0, -0.5);
                offset.applyQuaternion(head.orientation);
                square.position.copy(head.position).add(offset);
                square.quaternion.copy(head.orientation);
            }
        }
        renderer.render(scene, camera);
    }

    init(); // Appeler init() une fois que les scripts sont (normalement) chargés
    animate();
</script>

</body>
</html>
