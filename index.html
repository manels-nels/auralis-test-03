<!DOCTYPE html>
<html>
<head>
    <title>AR Plane Click Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Minimal A-Frame + AR.js test: Clicking a red plane.">

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
         /* Style simple pour le message (optionnel) */
        #click-message {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 3px;
            font-family: sans-serif; font-size: 14px; display: none; z-index: 10;
        }
    </style>
</head>

<body style='margin : 0px; overflow: hidden;'>

    <!-- Message indiquant le clic (caché au début) -->
    <div id="click-message">Clicked the Red Square!</div>

    <!-- Scène A-Frame AR -->
    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <!-- Pas d'assets nécessaires pour ce test -->

        <!-- Le carré rouge cliquable -->
        <a-plane
            id="red-square"
            position="0 1.5 -3"  <!-- Position devant la caméra -->
            width="1.5"          <!-- Taille du carré -->
            height="1.5"         <!-- Taille du carré -->
            color="red"          <!-- Couleur rouge -->
            material="shader: flat; side: double;" <!-- Simple rendu, visible des deux côtés -->
            data-interactive     <!-- Essentiel pour le raycaster -->
            >
            <!-- Pas besoin de plan enfant pour ce test simple -->
        </a-plane>

        <!-- Caméra avec cursor et raycaster -->
        <a-camera
            cursor="rayOrigin: mouse; fuse: false;"
            raycaster="objects: [data-interactive]; far: 20;" <!-- Ajout de 'far' pour être sûr -->
            >
            <!-- showLine: true peut être ajouté au raycaster pour visualiser -->
            <!-- raycaster="objects: [data-interactive]; far: 20; showLine: true;" -->
        </a-camera>

    </a-scene>

    <!-- Script minimal pour gérer le clic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener('loaded', () => {
                console.log("AR Scene Loaded. Adding listener.");
                const redSquare = document.getElementById('red-square');
                const clickMessage = document.getElementById('click-message');

                if (redSquare && clickMessage) {
                    redSquare.addEventListener('click', () => {
                        console.log("Red square clicked!");
                        // Affiche le message brièvement
                        clickMessage.style.display = 'block';
                        setTimeout(() => {
                            clickMessage.style.display = 'none';
                        }, 1500); // Cache après 1.5 secondes
                    });
                    console.log("Click listener added to red square.");
                } else {
                    console.error("Could not find red square or message element.");
                }
            });
        });
    </script>

</body>
</html>
