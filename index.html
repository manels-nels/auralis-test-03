<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RA - Cylindre d'Images</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Assets -->
      <a-assets>
        < img id="logo" src="images/logo.jpg">
        < img id="manels" src="images/manels.jpg">
      </a-assets>

      <!-- Caméra -->
      <a-camera position="0 1.6 0"></a-camera>

      <!-- Cylindre image 1 -->
      <a-cylinder
        position="-1 1 -3"
        radius="1"
        height="2"
        theta-length="60"
        open-ended="true"
        rotation="0 90 0"
        material="src: #logo; side: double; repeat: 1 1"
      ></a-cylinder>

      <!-- Cylindre image 2 -->
      <a-cylinder
        position="1 1 -3"
        radius="1"
        height="2"
        theta-length="60"
        open-ended="true"
        rotation="0 -90 0"
        material="src: #manels; side: double; repeat: 1 1"
      ></a-cylinder>
    </a-scene>
  </body>
</html>
