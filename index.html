<!DOCTYPE html>
<html>
<head>
    <title>MindAR Click Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <!-- 
        IMPORTANT USER NOTE: 
        The 'imageTargetSrc' below uses a default pre-compiled target from MindAR examples.
        To use your own image (e.g., images/logo.jpg) as the AR marker, you must:
        1. Compile your image using the MindAR online compiler: 
           https://hiukim.github.io/mindar-image-compiler/
        2. Upload the generated .mind file to your repository (e.g., into an 'assets' or 'targets' folder).
        3. Replace the 'imageTargetSrc' path below with the path to your .mind file.
        For this test, please use the image corresponding to the default target:
        https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.png
        (This is a playing card image - the 'card.mind' asset).
    -->
    <a-scene 
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: yes; uiLoading: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="userLogoTexture" src="images/logo.jpg" crossOrigin="anonymous">
      </a-assets>

      <a-camera 
        position="0 0 0" 
        look-controls="enabled: false" 
        cursor="rayOrigin: mouse; fuse: false;" 
        raycaster="objects: .clickable; far: 30;">
      </a-camera>

      <!-- This entity becomes active when the target (card.mind) is detected -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- This plane will display the user's logo.jpg texture -->
        <!-- It's positioned at the center of the target, scaled to roughly match a card aspect ratio -->
        <a-plane 
            class="clickable"
            src="#userLogoTexture" 
            position="0 0 0" 
            height="0.6" 
            width="0.6" 
            rotation="0 0 0">
        </a-plane>

        <a-text 
            id="mindarMessageText"
            value="hello from MindAR" 
            color="yellow"
            align="center"
            position="0 0.5 0" <!-- Slightly above the plane -->
            width="2"
            visible="false">
        </a-text>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const clickablePlane = document.querySelector('.clickable');
        const messageText = document.getElementById('mindarMessageText'); // Already declared here

        // Explicitly hide text on load
        if (messageText) {
            messageText.setAttribute('visible', 'false');
            console.log('Explicitly set mindarMessageText to invisible on load.');
        }

        if (clickablePlane && messageText) {
          clickablePlane.addEventListener('click', (event) => {
            console.log('Clickable plane hit with MindAR!');
            messageText.setAttribute('visible', 'true');
            // Optional: Hide message again after a few seconds
            setTimeout(() => {
              messageText.setAttribute('visible', 'false');
            }, 3000);
          });
        } else {
          if (!clickablePlane) console.error(".clickable element not found");
          if (!messageText) console.error("#mindarMessageText element not found");
        }

        // Optional: Listen for target found/lost events for debugging
        const targetEntity = document.querySelector('[mindar-image-target]');
        if (targetEntity) {
            targetEntity.addEventListener('targetFound', event => {
                console.log("MindAR Target Found");
            });
            targetEntity.addEventListener('targetLost', event => {
                console.log("MindAR Target Lost");
            });
        }
      });
    </script>
</body>
</html>
