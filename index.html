<!DOCTYPE html>
<html>
<head>
    <title>AR Simple Click Test (Button on Hover - NO LOADER)</title> <!-- Titre mis à jour -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Minimal A-Frame + AR.js: Clicking HTML button on hover. NO LOADER.">

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
         /* Message de feedback simple */
        #feedback-message {
            position: absolute;
            bottom: 95px; /* Positionné au-dessus du bouton d'action */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
            display: none; /* Caché au début */
            z-index: 10;
        }
         /* Style pour le bouton d'action */
         #square-action-button {
            position: absolute;
            bottom: 20px; /* Position fixe en bas */
            left: 50%;
            transform: translateX(-50%); /* Centré horizontalement */
            z-index: 10; /* Même niveau que le feedback */
            display: none; /* Caché au début */
            padding: 12px 20px; /* Plus grand */
            background: white;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        /* PAS DE STYLE POUR LE LOADER */
    </style>
</head>

<body style='margin: 0px; overflow: hidden;'>

    <!-- PAS DE LOADER ICI -->

    <div id="feedback-message">Button Clicked!</div>
    <!-- Bouton HTML pour l'action -->
    <button id="square-action-button">Action on Square</button>

    <!-- Scène A-Frame AR -->
    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <!-- Le carré rouge (AVEC data-interactive) -->
        <a-plane
            id="target-square"
            position="0 1.6 -3"
            width="1.5"
            height="1.5"
            color="#FF0000"
            material="shader: flat; side: double;"
            data-interactive 
            >
        </a-plane>

        <!-- Caméra AVEC cursor et raycaster -->
        <a-camera
            id="camera"
            cursor="rayOrigin: mouse; fuse: false;" 
            raycaster="objects: [data-interactive];" 
            >
        </a-camera>

    </a-scene>

    <!-- Script pour gérer le survol et le clic bouton -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener('loaded', () => {
                console.log("AR Scene Loaded. Setting up hover/button interaction...");

                const targetSquare = document.getElementById('target-square');
                const actionButton = document.getElementById('square-action-button');
                const feedbackMessage = document.getElementById('feedback-message');
                // PAS DE RÉFÉRENCE AU LOADER ICI

                // PAS DE CODE POUR CACHER LE LOADER ICI

                // Vérifier si les éléments existent
                if (targetSquare && actionButton && feedbackMessage) {

                    // Action lorsque le BOUTON HTML est cliqué
                    actionButton.addEventListener('click', () => {
                        console.log("Action button clicked!");
                        feedbackMessage.textContent = "Button Clicked!";
                        feedbackMessage.style.display = 'block';
                        // Changer couleur carré pour confirmation
                        targetSquare.setAttribute('color', '#' + Math.floor(Math.random()*16777215).toString(16));
                        setTimeout(() => { feedbackMessage.style.display = 'none'; }, 1500);
                    });

                    // Afficher le bouton HTML quand le curseur ENTRE sur le carré A-Frame
                    targetSquare.addEventListener('mouseenter', () => {
                        console.log("Mouse entered target square, showing button.");
                        actionButton.style.display = 'block';
                    });

                    // Cacher le bouton HTML quand le curseur QUITTE le carré A-Frame
                    targetSquare.addEventListener('mouseleave', () => {
                        console.log("Mouse left target square, hiding button.");
                        actionButton.style.display = 'none';
                    });

                    console.log("Listeners added for hover and button click.");

                } else {
                    if (!targetSquare) console.error("Element #target-square not found!");
                    if (!actionButton) console.error("Element #square-action-button not found!");
                    if (!feedbackMessage) console.error("Element #feedback-message not found!");
                }
                 console.log("Initialization finished.");
            }); // Fin loaded
        }); // Fin DOMContentLoaded
    </script>

</body>
</html>
