<!DOCTYPE html>
<html>
<head>
    <title>AURALIS Experience (Cursor Listener Test)</title> <!-- Titre mis à jour -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="A-Frame + AR.js testing cursor listener with collider."> <!-- Description mise à jour -->

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <style>
        /* --- Style pour l'écran de chargement initial --- */
        #initial-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2a; z-index: 10000; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
            color: white; font-size: 1.5em; font-family: sans-serif; text-align: center;
            line-height: 1.4; opacity: 1; transition: opacity 0.7s ease-out;
        }
        /* --- Style et animation pour le spinner --- */
        .loader-spinner {
            border: 5px solid rgba(255, 255, 255, 0.3); border-top-color: #FFFFFF;
            border-radius: 50%; width: 50px; height: 50px; margin-bottom: 25px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* Style pour le corps */
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        /* Style pour le message pop-up */
        #message-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            opacity: 0; visibility: hidden; z-index: 10001; background-color: rgba(30, 30, 50, 0.85);
            color: white; padding: 20px 30px; border-radius: 8px; text-align: left;
            font-size: 1.1em; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: pointer; width: 90%; box-sizing: border-box; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out, visibility 0s linear 0.3s;
            max-height: 75vh; overflow-y: auto;
        }
        #message-popup.visible {
            opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out, visibility 0s linear 0s;
        }
        /* Style pour le bouton Son */
        #sound-toggle-button {
            position: absolute; bottom: 20px; left: 20px; z-index: 9;
            padding: 10px 15px; font-size: 1em; font-family: sans-serif; color: #333;
            background-color: rgba(255, 255, 255, 0.8); border: 1px solid #ccc;
            border-radius: 5px; cursor: pointer; display: none;
        }
        #sound-toggle-button:hover { background-color: rgba(255, 255, 255, 1); }
    </style>
</head>

<body style='margin : 0px; overflow: hidden;'>

    <div id="initial-loader">
        <div class="loader-spinner"></div>
        <div>Auralis experience Loading,<br>be patient...</div>
    </div>
    <div id="message-popup"></div>
    <button id="sound-toggle-button">Play Sound</button>

    <a-scene
        id="ar-scene"
        embedded
        arjs='sourceType: webcam; trackingMethod: best; debugUIEnabled: false;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui='enabled: false'>

        <a-assets timeout="60000"> <!-- Timeout augmenté -->
             <img id="logoAsset" src="images/logo.jpg" crossOrigin="anonymous">
             <img id="wangMengAsset" src="images/wang_meng.jpg" crossOrigin="anonymous">
             <img id="yumiaoAsset" src="images/yu_miao.jpg" crossOrigin="anonymous">
             <img id="manelsAsset" src="images/manels.jpg" crossOrigin="anonymous">
             <img id="stageWideAsset" src="images/stage_wide.jpg" crossOrigin="anonymous">
             <img id="stageduoBlueAsset" src="images/stage_duo_blue.jpg" crossOrigin="anonymous">
             <img id="stageduoDarkAsset" src="images/stage_duo_dark.jpg" crossOrigin="anonymous">
             <audio id="logoAudio" src="audio/auralis.mp3" preload="auto" crossOrigin="anonymous"></audio>
             <a-asset-item id="jellyfishModel" src="models/meduse.glb" crossOrigin="anonymous"></a-asset-item>
        </a-assets>

        <!-- Images visibles (SANS data-interactive si contrôlées par collider) -->
        <a-image id="clickable-logo" src="#logoAsset" position="0 1.5 -2.7" width="1" height="1" sound="src: #logoAudio; loop: true; volume: 0.8; positional: true"></a-image>
        <a-image id="clickable-wangmeng" src="#wangMengAsset" position="1.5 1.5 -2.5" width="1" height="1.2"></a-image>
        <a-image id="clickable-yumiao" src="#yumiaoAsset" position="-1.5 1.5 -3" width="1.5" height="1" ></a-image>
        <a-image id="clickable-manels" src="#manelsAsset" position="1.5 3 -3.2" width="1" height="1.25" ></a-image>
        <a-image id="clickable-stagewide" src="#stageWideAsset" position="-1.5 0 -2.8" width="2" height="1.1" ></a-image>
        <a-image id="clickable-stageduoblue" src="#stageduoBlueAsset" position="0 3 -3" width="1.8" height="1.1" ></a-image>
        <a-image id="clickable-stageduodark" src="#stageduoDarkAsset" position="1 0 -2.5" width="1.8" height="1.1" ></a-image>

        <!-- Colliders invisibles (ou visibles pour debug) pour les images cliquables -->
        <a-plane id="logo-collider" data-target="#clickable-logo" position="0 1.5 -2.6" width="1.1" height="1.1" material="visible: true;" data-interactive ></a-plane>
        <a-plane id="wangmeng-collider" data-target="#clickable-wangmeng" position="1.5 1.5 -2.4" width="1.1" height="1.32" material="visible: true;" data-interactive ></a-plane>
        <!-- Ajoute les autres colliders ici si tu veux les rendre cliquables via cette méthode -->
        <!-- <a-plane id="yumiao-collider" data-target="#clickable-yumiao" position="-1.5 1.5 -3" width="1.65" height="1.1" material="visible: true;" data-interactive ></a-plane> -->
        <!-- ... etc ... -->


        <!-- Méduses (IDs corrigés) -->
        <a-gltf-model id="jellyfish-1" src="#jellyfishModel" position="-1 2 -2" scale="0.3 0.3 0.3" rotation="0 0 0" animation__pos="property: position; from: -1 2 -2; to: 1 1.2 -1.5; dir: alternate; dur: 12000; easing: easeInOutSine; loop: true;" animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;" animation-mixer="clip: *; loop: repeat"></a-gltf-model>
        <a-gltf-model id="jellyfish-2" src="#jellyfishModel" position="-1 2 -5" scale="0.2 0.2 0.2" rotation="0 0 0" animation__pos="property: position; from: 1 2 -4; to: -1 -1.2 -4; dir: alternate; dur: 18000; easing: easeInOutSine; loop: true;" animation__rot="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true;" animation-mixer="clip: *; loop: repeat"></a-gltf-model>

        <!-- Caméra -->
        <a-camera id="camera" cursor="rayOrigin: mouse; fuse: false;" raycaster="objects: [data-interactive]; useWorldCoordinates: true; showLine: true;" ></a-camera>

    </a-scene>

    <!-- Script pour gérer le clic ET le son -->
    <script>
        // Fonction pour activer/désactiver le son du logo (INCHANGÉE)
        function toggleLogoSound() {
            const logoElement = document.getElementById('clickable-logo');
            const soundButton = document.getElementById('sound-toggle-button');
            if (!logoElement || !soundButton) { console.error("Logo element or sound button not found."); return; }
            const soundComponent = logoElement.components.sound;
            if (!soundComponent) { console.error("Sound component not found on logo element."); return; }
            const sceneEl = document.querySelector('a-scene');
            const audioContext = sceneEl?.audioListener?.context;
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume().catch(e => console.error("Error resuming audio context", e));
            }
            if (soundComponent.isPlaying) {
                soundComponent.pauseSound(); soundButton.textContent = "Play Sound";
            } else {
                soundComponent.playSound(); soundButton.textContent = "Pause Sound";
            }
        }

        // Fonction séparée pour l'effet machine à écrire (INCHANGÉE)
        function startTypingEffect(popupElement, text) {
            let charIndex = 0;
            const typingSpeed = 40;
            popupElement.textContent = '';
            popupElement.scrollTop = 0;
            popupElement.classList.add('visible');
            if (window.typingIntervalId) { clearInterval(window.typingIntervalId); }
            window.typingIntervalId = setInterval(() => {
                if (charIndex < text.length) {
                    popupElement.textContent += text.charAt(charIndex);
                    charIndex++;
                    popupElement.scrollTop = popupElement.scrollHeight;
                } else {
                    clearInterval(window.typingIntervalId);
                    window.typingIntervalId = null;
                    console.log("Typing effect finished.");
                }
            }, typingSpeed);
        }

        // --- Logique d'initialisation MODIFIÉE ---
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener('loaded', () => {
                console.log("A-Frame scene loaded. Initializing interactions via Cursor Listener...");

                // Cacher l'écran de chargement initial
                const initialLoader = document.getElementById('initial-loader');
                if (initialLoader) {
                    initialLoader.style.opacity = '0';
                    setTimeout(() => { initialLoader.style.display = 'none'; }, 700);
                } else { console.warn("Initial loader element not found!"); }


                // --- Listener de clic sur le curseur/caméra ---
                const cameraEl = document.getElementById('camera');
                const messagePopup = document.getElementById('message-popup');

                if (cameraEl && messagePopup) {
                    console.log("Adding click listener to camera cursor.");
                    cameraEl.addEventListener('click', (event) => {
                        const clickedEl = event.detail.intersectedEl; // Élément touché

                        if (clickedEl && clickedEl.hasAttribute('data-interactive')) { // Vérifie si l'élément touché est interactif
                            console.log(`Cursor clicked on interactive element: #${clickedEl.id}`);

                            // Arrêter la frappe si elle est en cours
                            if (window.typingIntervalId) { clearInterval(window.typingIntervalId); window.typingIntervalId = null; console.log("Typing effect interrupted."); }

                            let textToShow = "";
                            // Vérifie l'ID du collider cliqué
                            if (clickedEl.id === 'logo-collider') {
                                textToShow = "Imagine a space where sound moves like liquid, where music is not confined to speakers but swirls around you, weaving an intricate web of vibration and light. Here the past and the Future collide, ancient strings resonate against modern frequencies, and the visual pulse in perfect harmony with a never-shifting soundscape, Welcome to AURALIS";
                                startTypingEffect(messagePopup, textToShow);
                            } else if (clickedEl.id === 'wangmeng-collider') {
                                textToShow = "bye";
                                messagePopup.textContent = textToShow;
                                messagePopup.classList.add('visible');
                            }
                            // Ajoutez d'autres 'else if (clickedEl.id === '...-collider')' ici pour les autres colliders
                            else {
                                console.warn(`Clicked on unhandled interactive element: #${clickedEl.id}`);
                                messagePopup.textContent = `Clicked on ${clickedEl.id}`;
                                messagePopup.classList.add('visible');
                            }
                        } else {
                           console.log("Cursor clicked, but no interactive element intersected.");
                        }
                    });
                } else {
                     if (!cameraEl) console.error("Camera element (#camera) not found!");
                     if (!messagePopup) console.error("Message popup element (#message-popup) not found!");
                }
                // --- FIN Listener Caméra ---


                // Écouteur pour cacher le popup
                if (messagePopup) {
                    messagePopup.addEventListener('click', (event) => {
                        if (event.target !== messagePopup) { return; } // Ne ferme que si on clique sur le fond
                        if (window.typingIntervalId) { clearInterval(window.typingIntervalId); window.typingIntervalId = null; console.log("Typing effect interrupted by closing popup."); }
                        console.log("Popup clicked directly, hiding.");
                        messagePopup.classList.remove('visible');
                    });
                     console.log("Added click listener to hide message popup.");
                }

                // Activer le bouton Son
                const soundButton = document.getElementById('sound-toggle-button');
                const logoElementExists = document.getElementById('clickable-logo'); // Vérifie l'image visible pour le son
                if (soundButton && logoElementExists) {
                    console.log("Making sound toggle button visible and attaching listener.");
                    soundButton.style.display = 'block';
                    soundButton.addEventListener('click', toggleLogoSound);
                } else {
                    if (!soundButton) console.error("Sound toggle button element not found!");
                    if (!logoElementExists) console.error("Logo element (#clickable-logo) not found, cannot activate sound button!");
                }

                console.log("Initialization complete.");

            }); // Fin de sceneEl.addEventListener('loaded')
        }); // Fin de document.addEventListener('DOMContentLoaded')
    </script>
</body>
</html>
